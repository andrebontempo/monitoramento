auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki          # ← ERA /tmp/loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks   # ← ERA /tmp/loki/chunks
      rules_directory: /loki/rules     # ← ERA /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  ingestion_rate_mb: 16        # era 4MB/s (padrão), aumentar para 16
  ingestion_burst_size_mb: 32
  reject_old_samples: true
  reject_old_samples_max_age: 720h   # aceitar logs de até 30 dias
